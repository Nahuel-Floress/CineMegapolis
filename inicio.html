<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login and register</title>
    <link rel="stylesheet" href="css/inicio.css">
</head>
<body>
    <div class="container">
    <div class="container-form">
        <form class="sign-in">
            <h2>Inicia sesion</h2>
             <span> CORREO Y CONTRASEÑA</span>
            <div class="container-input">
               <ion-icon name="mail-outline"></ion-icon>
               <input type="text" placeholder="Email">
            </div>
            <div class="container-input">
               <ion-icon name="lock-closed-outline"></ion-icon>
               <input type="password" placeholder="Password">
            </div>
            <a href="#">¿Olvidaste tu contraseña?</a>
            <br>
            <button class="button">INICIAR SESION </button>
        </form>
    </div>

    <div class="container-form">
        <form class="sign-up">
            <h2>Registrarse</h2>
              <span> CORREO Y CONTRASEÑA</span>
            <div class="container-input">
               <ion-icon name="mail-outline"></ion-icon>
               <input type="text" placeholder="Email">
            </div>
            <div class="container-input">
               <ion-icon name="lock-closed-outline"></ion-icon>
               <input type="password" placeholder="Password">
            </div>
            <span>TELEFONO</span>
            <div class="container-input">
                <ion-icon name="call-outline"></ion-icon>
                <input type="tel" placeholder="Telefono">
            </div>
             <span>NOMBRE</span>
            <div class="container-input">
               <ion-icon name="person-outline"></ion-icon>
               <input type="text" placeholder="Nombre">
            </div>
             <span>APELLIDO</span>
            <div class="container-input">
                <ion-icon name="person-outline"></ion-icon>
                <input type="text" placeholder="Apellido">
            </div>
             <span>DNI</span>
            <div class="container-input">
                <ion-icon name="id-card-outline"></ion-icon>
                <input type="text" placeholder="Dni">
            </div>
            <span>FECHA DE NACIMIENTO</span>
            <div class="container-input">
                <ion-icon name="calendar-outline"></ion-icon>
                <input type="date" placeholder="Fecha">
            </div>
            <div class="form-group">
    <input type="checkbox" id="terminos" name="terminos" required>
    <label for="terminos">
      Acepto los <a href="/terminos-y-condiciones" target="_blank">Términos y Condiciones</a> y la <a href="/politica-de-privacidad" target="_blank">Política de Privacidad</a>.
    </label>
  </div>
  <button class="button">REGISTRARSE</button>
        </form>
    </div>
      <div class="container-welcome">
        <div class="welcome-sign-up welcome">
            <h3>Bienvenido!</h3>
            <p>Ingrese sus datos para usar nuestras funciones</p>
            <button class="button" id="btn-sign-up">REGISTRARSE</button>
        </div>
        <div class="welcome-sign-in welcome">
            <h3>Hola!</h3>
            <p>Registrese con sus datos para usar nuestras funciones</p>
            <button class="button" id="btn-sign-in">INICIAR SESION</button>
        </div>
      </div>
    </div>
    <script src="js/inicio.js"></script>
    <script  type = "module"  src = " https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js " > </script> 
    <script nomodule src = " https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js " >   </script>
</body>
</html>
